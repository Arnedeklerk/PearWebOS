<!doctype html>
<!--
  PearWebOS as an app of its own, for TVs whose LG Home isn't QML (webOS 10's
  is Flutter). The same Home as qml/PearHome.qml, in HTML; peard (tv/peard.js)
  answers it as it does there, and homeguard opens it whenever LG's Home
  comes up. Laid out at 1920x1080 and scaled to the screen.
-->
<html>
<head>
<meta charset="utf-8">
<title>Pear</title>
<link rel="stylesheet" href="pear.css">
</head>
<body>
<div id="stage">
    <div id="backdrop"><img id="photoA" alt=""><img id="photoB" alt=""></div>
    <div id="shade"></div>

    <div id="page">
        <div id="header">
            <div id="greeting"></div>
            <div id="date"><span id="dateText"></span><i class="base"></i></div>
            <div id="clock"><span id="clockText"></span><i class="base"></i></div>
            <div id="ampm"></div>
        </div>

        <div id="topbar">
            <div id="topLabel"></div>
            <div class="button" data-key="inputs">
                <div class="disc"><svg viewBox="0 0 40 40"><g fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="12" y="7.2" width="24.8" height="20"/>
                    <path d="M16 34.4h16.8M1.6 17.2h18.4M15.2 12.4l4.8 4.8-4.8 4.8"/></g></svg></div>
            </div>
            <div class="button" data-key="settings">
                <div class="disc"><svg viewBox="-20 -20 40 40"><g class="teeth"></g><g fill="none" stroke-width="3.2">
                    <circle r="12"/><circle r="4.4"/></g></svg></div>
            </div>
        </div>

        <div id="dock"><div id="dockRow" class="row"></div></div>

        <div id="allApps"><svg viewBox="0 0 24 14"><path d="M3 3l9 8 9-8" fill="none" stroke="#fff" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round"/></svg>All apps</div>

        <div id="grid"><div id="gridRows"></div></div>
    </div>

    <div id="panel">
        <div id="dim"></div>
        <div id="sheet">
            <div id="heading"></div>
            <div id="body">
                <div id="rows"></div>
                <div id="editor">
                    <div id="editorLabel"></div>
                    <input id="field" maxlength="40" autocomplete="off" spellcheck="false">
                    <div id="editorNote"></div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="home.js"></script>
<script src="panels.js"></script>
</body>
</html>
